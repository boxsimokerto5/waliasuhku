name: Build & Sign Android APK & AAB (Google Play Store)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Jenis Build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - apk_only
          - aab_only

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install Dependencies
        run: npm install

      - name: 6. Build Web App (Vite React)
        run: npm run build

      - name: 7. Setup & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Membuat folder platform android dengan Capacitor..."
            npx cap add android
          else
            echo "Platform android sudah ada."
          fi
          npm run cap:assets || true
          npx cap sync android

          # Sync Version Code and Version Name for Play Store Overwrite Updates
          VERSION_NAME=$(node -p "require('./package.json').version")
          BUILD_NUMBER="${{ github.run_number }}"
          echo "Updating android/app/build.gradle with versionCode=$BUILD_NUMBER and versionName=$VERSION_NAME"
          
          if [ -f "android/app/build.gradle" ]; then
            sed -i -E "s/versionCode [0-9]+/versionCode $BUILD_NUMBER/g" android/app/build.gradle
            sed -i -E "s/versionName \"[^\"]+\"/versionName \"$VERSION_NAME\"/g" android/app/build.gradle
          fi

      - name: 8. Setup Keystore (Otomatis / Secret)
        id: setup_keystore
        env:
          B64_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SEC_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SEC_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SEC_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/app/keystore
          USE_SECRET=false
          
          if [ -n "$B64_KEYSTORE" ]; then
            echo "=== Memeriksa Keystore dari GitHub Secrets ==="
            node -e "
              const fs = require('fs');
              const b64 = process.env.B64_KEYSTORE || '';
              const cleanB64 = b64.replace(/\s+/g, '');
              const buf = Buffer.from(cleanB64, 'base64');
              fs.writeFileSync('android/app/keystore/release.jks', buf);
              console.log('Keystore dari Secret didecode, ukuran:', buf.length, 'bytes');
            "
            
            # Verifikasi apakah keystore valid menggunakan keytool
            if keytool -list -keystore android/app/keystore/release.jks -storepass "$SEC_PASS" > /dev/null 2>&1; then
              echo "✓ Keystore dari GitHub Secrets Valid!"
              USE_SECRET=true
              echo "KEYSTORE_FILE=$(pwd)/android/app/keystore/release.jks" >> $GITHUB_ENV
              echo "KEYSTORE_PASSWORD=$SEC_PASS" >> $GITHUB_ENV
              echo "KEYSTORE_ALIAS=$SEC_ALIAS" >> $GITHUB_ENV
              echo "KEY_PASSWORD=$SEC_KEY_PASS" >> $GITHUB_ENV
            else
              echo "⚠️ PERINGATAN: ANDROID_KEYSTORE_BASE64 di GitHub Secrets korup atau tidak valid!"
              echo "Sistem akan beralih secara otomatis ke pembuatan Keystore resmi yang valid."
              rm -f android/app/keystore/release.jks
            fi
          fi

          if [ "$USE_SECRET" = "false" ]; then
            echo "=== Menggenerasi Keystore Otomatis untuk Rilis ==="
            KEY_PASS="WaliAsuhkuSecure2026Pass"
            KEY_ALIAS="waliasuhku_key"
            
            keytool -genkeypair -v \
              -keystore android/app/keystore/release.jks \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype PKCS12 \
              -storepass "$KEY_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=WaliAsuhku, OU=Development, O=WaliAsuhku, L=Jakarta, ST=DKI Jakarta, C=ID"

            echo "KEYSTORE_FILE=$(pwd)/android/app/keystore/release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
            echo "KEYSTORE_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV

            {
              echo "====================================================="
              echo "INFORMASI KEYSTORE PRODUKSI / PLAYSTORE WALIASUHKU"
              echo "====================================================="
              echo "Nama File Keystore : release.jks"
              echo "Alias              : $KEY_ALIAS"
              echo "Password Keystore  : $KEY_PASS"
              echo "Password Key       : $KEY_PASS"
              echo ""
              echo "PENTING:"
              echo "Simpan file release.jks dan password di atas secara aman!"
              echo "Gunakan file release.jks ini untuk setiap update app di Google Play Store."
            } > android/app/keystore/KEYSTORE_INFO.txt
          fi

      - name: 9. Build Release APK & AAB dengan Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: 10. Tandatangani (Sign) APK & AAB dengan apksigner (v1, v2, v3 Scheme)
        run: |
          set -e
          mkdir -p build-output

          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          
          echo "Ditemukan APK: $APK_PATH"
          echo "Ditemukan AAB: $AAB_PATH"

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: File APK hasil build gradle tidak ditemukan!"
            exit 1
          fi

          if [ -z "$AAB_PATH" ] || [ ! -f "$AAB_PATH" ]; then
            echo "Error: File AAB hasil build gradle tidak ditemukan!"
            exit 1
          fi

          VERSION_NAME=$(node -p "require('./package.json').version")
          BUILD_NUM="${{ github.run_number }}"
          FINAL_APK="build-output/WaliAsuhku-v${VERSION_NAME}-build${BUILD_NUM}.apk"
          FINAL_AAB="build-output/WaliAsuhku-v${VERSION_NAME}-build${BUILD_NUM}.aab"

          ANDROID_BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 2>/dev/null | sort -V | tail -n 1)
          echo "Menggunakan Android Build Tools dari: $ANDROID_BUILD_TOOLS"

          # Deteksi jenis keystore secara otomatis (JKS magic header 0xFEEDFEED vs PKCS12)
          KS_TYPE="PKCS12"
          MAGIC_HEADER=$(node -p "
            const fs = require('fs');
            try {
              const buf = fs.readFileSync(process.env.KEYSTORE_FILE);
              if (buf.length >= 4 && buf[0] === 0xfe && buf[1] === 0xed && buf[2] === 0xfe && buf[3] === 0xed) {
                console.log('jks');
              } else {
                console.log('pkcs12');
              }
            } catch(e) {
              console.log('pkcs12');
            }
          ")
          if [ "$MAGIC_HEADER" = "jks" ]; then
            KS_TYPE="JKS"
          fi
          echo "Format Keystore Terdeteksi: $KS_TYPE"

          # 1. Alignment APK terlebih dahulu dengan zipalign ke file sementara
          echo "=== Step 1: Alignment APK dengan zipalign ==="
          TEMP_ALIGNED_APK="build-output/aligned-temp.apk"
          $ANDROID_BUILD_TOOLS/zipalign -v -f 4 "$APK_PATH" "$TEMP_ALIGNED_APK"

          # 2. Tandatangani APK dengan apksigner (Output ke FINAL_APK)
          echo "=== Step 2: Penandatanganan APK dengan apksigner ==="
          $ANDROID_BUILD_TOOLS/apksigner sign \
            --ks "$KEYSTORE_FILE" \
            --ks-type "$KS_TYPE" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEYSTORE_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$FINAL_APK" \
            "$TEMP_ALIGNED_APK"
          
          rm -f "$TEMP_ALIGNED_APK"

          # 3. Verifikasi tanda tangan APK
          echo "=== Step 3: Verifikasi tanda tangan APK ==="
          $ANDROID_BUILD_TOOLS/apksigner verify --verbose "$FINAL_APK" || true

          # 4. Sign AAB (Google Play Store Bundle)
          echo "=== Step 4: Penandatanganan AAB untuk Play Store ==="
          cp "$AAB_PATH" "$FINAL_AAB"
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "$KEYSTORE_FILE" \
            -storetype "$KS_TYPE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$FINAL_AAB" \
            "$KEYSTORE_ALIAS"

          echo "=== BUILD & SIGNING SELESAI DENGAN SUKSES ==="
          ls -la build-output/

      - name: 11. Upload Artifacts APK
        uses: actions/upload-artifact@v4
        with:
          name: WaliAsuhku-APK-Release
          path: build-output/*.apk
          retention-days: 30

      - name: 12. Upload Artifacts AAB (Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: WaliAsuhku-AAB-PlayStore
          path: build-output/*.aab
          retention-days: 30

      - name: 13. Upload Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: Keystore-Backup-Simpan-Aman
          path: android/app/keystore/
          retention-days: 30
